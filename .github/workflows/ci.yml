name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: System libraries for macroquad
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxi-dev libgl1-mesa-dev libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
      - name: Validate base data pack
        run: cargo run --release -p hero-tools -- validate data/base
      - name: Simulate every battle (AI vs AI smoke test)
        run: cargo run --release -p hero-tools -- simulate data/base --seeds 8
      - name: Web JS bundle matches the locked crates
        # web/mq_js_bundle.js is generated from these crates' JavaScript; after an upgrade the wasm
        # still builds but its imports no longer match the page's JavaScript.
        run: |
          for crate in miniquad quad-snd sapp-jsutils; do
            locked=$(awk -v n="$crate" '$0 == "name = \"" n "\"" { getline; gsub(/version = |"/, ""); print; exit }' Cargo.lock)
            if ! grep -q "^//   $crate $locked " web/mq_js_bundle.js; then
              echo "::error::web/mq_js_bundle.js is not built from $crate $locked (Cargo.lock): run tools/web/update-js-bundle.ps1"
              exit 1
            fi
          done
      - name: Web JS plugin version matches the crate
        # hero_web.js and platform/web.rs must be bumped together; the miniquad loader only reports
        # a mismatch in the browser console, so a forgotten bump would go unnoticed.
        run: |
          js=$(sed -n 's/.*name: "hero_web", version: \([0-9]*\).*/\1/p' web/hero_web.js)
          rs=$(sed -n 's/^pub const HERO_WEB_VERSION: u32 = \([0-9]*\);/\1/p' crates/hero-game/src/platform/web.rs)
          if [ -z "$js" ] || [ -z "$rs" ] || [ "$js" != "$rs" ]; then
            echo "::error::web/hero_web.js version '$js' != HERO_WEB_VERSION '$rs' in crates/hero-game/src/platform/web.rs"
            exit 1
          fi
      - name: WebAssembly clippy
        run: cargo clippy -p hero-game --target wasm32-unknown-unknown -- -D warnings
      - name: WebAssembly build
        run: cargo build --release -p hero-game --target wasm32-unknown-unknown

  assets:
    # The asset pipeline's unit tests, including the check that the committed fonts hold every Hanja
    # of the base pack's text (a missing one is drawn as a blank in the game). Needs no cached sources.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pipeline dependencies
        run: pip install pillow "fonttools[woff]==4.66.0" ruff==0.16.9
      - name: Lint
        run: |
          ruff check tools/assets tools/web tools/artpack
          ruff format --check tools/assets tools/web tools/artpack
      - name: Unit tests
        run: |
          python -m unittest discover -s tools/assets -p "test_*.py"
          python -m unittest discover -s tools/web -p "test_*.py"
      - name: Application icon matches its script
        run: python tools/assets/build_icon.py --check
      - name: New-art atlases match their scripts (D27)
        run: python tools/artpack/build.py --check

  native:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release -p hero-game
      - name: Tests
        run: cargo test -p hero-core
