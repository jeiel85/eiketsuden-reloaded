[workspace]
resolver = "2"
members = ["crates/hero-core", "crates/hero-game", "crates/hero-import", "crates/hero-tools"]

[workspace.package]
version = "0.6.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/jeiel85/eiketsuden-reloaded"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
thiserror = "2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4

[profile.dev.package."*"]
opt-level = 2
