<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>영걸전 Reloaded — Eiketsuden Reloaded</title>
  <meta name="description" content="삼국지 영걸전(1995)을 현대 시스템에서 원작대로 돌리는 오픈소스 엔진. Rust로 만들어 Windows · macOS · Linux에서 동작하며, 가지고 있는 원작을 읽어 플레이합니다.">
  <!-- Inline icon (a banner on a blue field) so the site needs no separate favicon file. -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'%3E%3Crect width='16' height='16' fill='%231c2f78'/%3E%3Crect x='1.5' y='1.5' width='13' height='13' fill='none' stroke='%23e8d9a8'/%3E%3Crect x='5' y='3' width='1' height='10' fill='%23e8d9a8'/%3E%3Crect x='6' y='4' width='6' height='5' fill='%23c8402f'/%3E%3C/svg%3E">
  <style>
    :root { --bg: #0b0d14; --ink: #e8d9a8; --muted: #9a8f70; }
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: var(--bg); }
    canvas {
      display: block; position: absolute; inset: 0; width: 100%; height: 100%;
      outline: none; image-rendering: pixelated; touch-action: none; z-index: 0;
    }
    #loading {
      position: absolute; inset: 0; z-index: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 12px; background: var(--bg);
      color: var(--ink); font-family: "Galmuri11", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
      text-align: center; padding: 0 16px;
    }
    #loading h1 { margin: 0; font-size: 28px; letter-spacing: 2px; }
    #loading p { margin: 0; color: var(--muted); font-size: 14px; }
    #loading .bar { width: min(320px, 80vw); height: 6px; border: 1px solid var(--muted); }
    #loading .bar i { display: block; height: 100%; width: 30%; background: var(--ink); animation: slide 1.2s ease-in-out infinite alternate; }
    @keyframes slide { from { margin-left: 0; } to { margin-left: 70%; } }
    noscript { color: var(--ink); }
    #crash {
      position: absolute; inset: 0; z-index: 2; overflow: auto; box-sizing: border-box;
      padding: 24px 16px; background: rgba(11, 13, 20, 0.92); color: var(--ink);
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    }
    #crash h1 { margin: 0 0 8px; font-size: 20px; }
    #crash p { margin: 0 0 12px; color: var(--muted); font-size: 14px; }
    #crash pre { margin: 0; white-space: pre-wrap; word-break: break-word; font-size: 12px; }
  </style>
</head>
<body>
  <canvas id="glcanvas" tabindex="1"></canvas>
  <div id="loading">
    <h1>영걸전 Reloaded</h1>
    <div class="bar"><i></i></div>
    <p>불러오는 중… / Loading…</p>
    <noscript>이 게임은 JavaScript와 WebAssembly가 필요합니다.</noscript>
  </div>
  <script src="mq_js_bundle.js"></script>
  <script src="hero_web.js"></script>
  <script>load("eiketsuden.wasm");</script>
</body>
</html>
